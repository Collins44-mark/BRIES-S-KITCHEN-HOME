services:
  postgres:
    image: postgres:16-alpine
    container_name: bries-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bries_home_kitchen
    volumes:
      - bries_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bries_home_kitchen']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bries_pg_data:
